:root{
  --cream:#FBF6E3;--pink:#F2B8B5;--orange:#E8592B;--lime:#D6D35F;--sky:#D2E4F4;--plum:#8C1F4A;
  --blue:#80B0E8;--green:#008471;--lav:#D1CAEA;--sun:#F4D242;--bubble:#F29CC3;--tomato:#C45F3F;
  --ink:#2B1620;--soft:#6E5560;--line:rgba(43,22,32,.12);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;touch-action:manipulation;overflow-x:hidden}
img{max-width:100%}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:DM,-apple-system,system-ui,sans-serif;font-size:16px}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.disp{font-family:Krona,DM,sans-serif;font-weight:400;letter-spacing:.02em;line-height:1.08;text-transform:uppercase}
header{padding:calc(14px + env(safe-area-inset-top)) 20px 6px;display:flex;align-items:flex-start;justify-content:space-between}
.logo{font-size:clamp(24px,8vw,30px);color:var(--orange)}
.logo span{display:block}
.gear{width:44px;height:44px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:20px}
.hello{padding:0 20px 8px;color:var(--soft);font-weight:500}
main{padding:6px 16px 0}
.view{display:none;animation:in .25s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{border-radius:var(--r);padding:18px;margin-bottom:14px;background:#fff;position:relative;overflow:hidden}
.card h3{margin:0 0 10px;font-size:17px}
.c-orange{background:var(--orange);color:var(--pink)}
.c-pink{background:var(--pink);color:var(--orange)}
.c-plum{background:var(--plum);color:var(--sky)}
.c-sky{background:var(--sky);color:var(--plum)}
.c-lime{background:var(--lime);color:#3c3b0a}
.c-limeL{background:#F4F2D2;color:#5d5b12}
.c-green{background:var(--green);color:#E7F2C9}
.c-lav{background:var(--lav);color:var(--tomato)}
.c-sun{background:var(--sun);color:var(--green)}
.c-blue{background:var(--blue);color:#FFF6C9}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
.grid2 .card{margin:0}
.big{font-family:Krona,DM;font-size:clamp(26px,9vw,34px);line-height:1.1;margin:4px 0}
.lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.muted{opacity:.75;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:999px;font-weight:700;background:var(--ink);color:var(--cream);font-size:16px}
.btn.full{width:100%}
.btn.light{background:rgba(255,255,255,.55);color:inherit}
.btn.orange{background:var(--orange);color:var(--cream)}
.btn.plum{background:var(--plum);color:var(--sky)}
.btn.green{background:var(--green);color:#E7F2C9}
.btn.sm{padding:9px 14px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:rgba(43,22,32,.07);font-weight:700;font-size:14px}
.chip.on{background:var(--ink);color:var(--cream)}
/* tabs */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--ink);border-radius:28px;display:flex;padding:7px;z-index:20;box-shadow:0 10px 30px rgba(43,22,32,.25)}
nav button{flex:1;color:var(--cream);opacity:.6;padding:8px 0 6px;border-radius:22px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px}
nav button.on{opacity:1;background:var(--orange)}
nav button.on[data-v=treino]{background:var(--plum)}
nav button.on[data-v=comida]{background:var(--green)}
nav button.on[data-v=corpo]{background:var(--blue);color:var(--ink)}
/* week dots */
.week{display:flex;justify-content:space-between;margin-top:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700}
.dot{width:clamp(28px,9vw,36px);height:clamp(28px,9vw,36px);border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center;font-size:15px}
.dot.done{background:currentColor}
.dot.done b{color:var(--plum)}
.dot.today{outline:3px dashed currentColor;outline-offset:3px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:13px;font-weight:700}
.cal .h{opacity:.6;font-size:11px}
.cal .d{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;position:relative}
.cal .d.t{background:var(--plum);color:var(--sky)}
.cal .d.w{background:var(--orange);color:var(--cream)}
.cal .d.now{outline:2px solid var(--ink)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calnav button{width:36px;height:36px;border-radius:50%;background:rgba(43,22,32,.07);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;margin-top:10px;font-weight:500}
.legend s{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px;text-decoration:none}
/* treino */
.tsw{display:flex;background:rgba(43,22,32,.07);border-radius:999px;padding:5px;margin-bottom:14px}
.tsw button{flex:1;padding:12px;border-radius:999px;font-family:Krona,DM;font-size:15px;color:var(--soft)}
.tsw button.on{background:var(--plum);color:var(--sky)}
.ex{background:#fff;border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:background .2s}
.ex.done{background:#EFE7EE}
.exh{display:flex;gap:12px;align-items:center;padding:14px 14px 14px 12px}
.num{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:Krona,DM;font-size:20px}
.thumb{flex:none;width:72px;height:72px;border-radius:16px;position:relative;background:#eee center/cover no-repeat}
.thumb b{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:Krona,DM;font-size:12px;font-weight:400;box-shadow:0 0 0 3px #fff}
.ex.done .thumb b{box-shadow:0 0 0 3px #EFE7EE}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.frames figure{margin:0}
.frames img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block}
.frames figcaption{font-size:12px;font-weight:700;text-align:center;margin-top:4px;color:var(--plum)}
.fr-t{font-size:13px;font-weight:700;margin:14px 0 -4px;text-transform:uppercase;letter-spacing:.06em;color:var(--plum)}
.exn{flex:1;min-width:0}
.exn b{display:block;font-size:16px;line-height:1.25}

.exn small{display:block;color:var(--soft);font-weight:500;margin-top:3px;font-size:13px}
.chk{flex:none;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--plum);display:grid;place-items:center;color:transparent;font-weight:900}
.ex.done .chk{background:var(--plum);color:var(--sky)}
.exb{display:none;padding:0 16px 16px;font-size:15px;line-height:1.45}
.ex.open .exb{display:block}
.exb h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--plum)}
.exb ul{margin:0;padding-left:20px}
.exb li{margin:3px 0}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{background:var(--sky);color:var(--plum);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700}
.exact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{font-size:11px;font-weight:700;background:var(--sun);color:var(--green);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.modo{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 4px;scrollbar-width:none}
.modo::-webkit-scrollbar{display:none}

.modo button i{font-style:normal;font-size:24px}
.modo button.on{background:var(--orange);color:var(--cream)}
.gch{position:relative;height:190px;margin-top:6px}
.gch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gleg{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--soft);margin-top:10px;flex-wrap:wrap}
.gleg s{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:3px;margin-right:6px;text-decoration:none}
.gtip{margin-top:10px;background:var(--cream);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px}

.pg-t{margin:2px 4px 14px}
.pg-t h1{font-family:DM;font-weight:700;font-size:34px;letter-spacing:-.02em;margin:0;line-height:1.1}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}

.tile{border-radius:16px;padding:12px 12px 11px;display:flex;flex-direction:column;justify-content:space-between;min-height:84px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}

.tile span{font-size:12px;font-weight:500;opacity:.85;line-height:1.2}

.lbl2{font-size:13px;color:var(--soft);font-weight:500;margin-bottom:8px}
.stack{display:flex;gap:2px;height:14px;border-radius:8px;overflow:hidden;margin-bottom:12px}

.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:500}

.tchips{display:flex;flex-wrap:wrap;gap:8px}

.act{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid rgba(43,22,32,.08);border-left:4px solid var(--c);border-radius:14px;padding:12px;margin-bottom:8px}
.av{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 18%,#fff)}

.rec{background:#fff;border-radius:18px;margin-bottom:8px;overflow:hidden}
.rech{display:flex;align-items:center;gap:12px;padding:14px}

.rech b{display:block}
.rech small{color:var(--soft);font-size:13px}

/* corpo */
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.field input,.field select{border:0;border-radius:14px;padding:12px;background:rgba(255,255,255,.7);font-size:17px;font-weight:500;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:48px}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
table.hist{width:100%;border-collapse:collapse;font-size:14px}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block}
.cmp figcaption{font-size:12px;font-weight:700;text-align:center;margin-top:4px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(43,22,32,.45);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;z-index:41;padding:22px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1),visibility .3s;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet h2{font-size:22px;margin:0 0 14px;color:var(--orange)}
.sheet .x{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;background:rgba(43,22,32,.08);font-size:18px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow span{flex:1;font-weight:500}
.lrow input{width:120px;border:0;border-radius:12px;padding:10px;background:#fff;font-size:16px}

let modo='musc', cInt='moderado';
function modoChips(){ return `<div class="modo"><button class="${modo==='musc'?'on':''}" onclick="setModo('musc')"><i>💪</i>Musculação</button>${Object.entries(CARDIO).map(([k,c])=>`<button class="${modo===k?'on':''}" onclick="setModo('${k}')"><i>${c.em}</i>${({rua:'Corrida rua',praia:'Corrida praia'})[k]||c.n}</button>`).join('')}</div>`; }
function setModo(m){ modo=m; rTreino(); }
function rCardio(){
  const c=CARDIO[modo], d=hoje(), w=S.watch[d];
  const hist=S.sessoes.filter(s=>!s.treino).sort((a,b)=>a.data<b.data?1:-1).slice(0,8);
  const wt=w&&w.treinos.length?w.treinos:[];
  $('#v-treino').innerHTML = modoChips() + `
  <div class="card c-orange">
    <div class="lbl">Modalidade de hoje</div>
    <div class="disp" style="font-size:24px;margin:6px 0 14px">${c.em} ${c.n}</div>
    ${modo==='outro'?`<label class="field" style="margin-bottom:10px">Qual atividade?<input id="c-nome" placeholder="ex: beach tennis"></label>`:''}
    <div class="fgrid">
      <label class="field">Duração (min)<input id="c-min" type="number" inputmode="numeric" placeholder="40"></label>
      <label class="field">Distância (km)<input id="c-km" type="number" step="0.01" inputmode="decimal" placeholder="opcional"></label>
    </div>
    <div class="lbl" style="margin-bottom:8px">Como foi?</div>
    <div class="chips" style="margin-bottom:14px">${INT.map(([k,l])=>`<button class="chip ${cInt===k?'on':''}" style="${cInt===k?'':'background:rgba(255,255,255,.25);color:inherit'}" onclick="cInt='${k}';rCardio()">${l}</button>`).join('')}</div>
    ${wt.length?`<div class="muted" style="margin-bottom:8px">⌚ Do Watch hoje — toque para preencher:</div><div class="chips" style="margin-bottom:14px">${wt.map((t,i)=>`<button class="chip" style="background:rgba(255,255,255,.25);color:inherit" onclick="$('#c-min').value=${t.min}">${esc(t.tipo)} • ${t.min} min</button>`).join('')}</div>`:''}
    <button class="btn full" style="background:var(--pink);color:var(--orange);padding:16px;font-size:17px" onclick="salvaCardio()">Tá pago! 🎉</button>
  </div>
  <div class="card c-sky"><h3 class="disp">Dicas</h3><ul style="margin:0;padding-left:20px;line-height:1.45">${c.dicas.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="card">
    <h3 class="disp" style="color:var(--orange)">Últimos cardios</h3>
    ${hist.length?hist.map(s=>{ const cc=CARDIO[s.mod]||CARDIO.outro; const pace=s.km&&s.min?s.min/s.km:0; return `<div class="lrow"><span>${cc.em} <b>${esc(s.nome||cc.n)}</b><br><small class="muted">${fmtBR(s.data)} • ${(INT.find(x=>x[0]===s.int)||['',''])[1]}</small></span><div style="text-align:right;font-size:14px"><b>${s.km?String(s.km).replace('.',',')+' km':''}${s.km&&s.min?' • ':''}${s.min?s.min+' min':''}</b>${pace?`<br><small class="muted">${Math.floor(pace)}:${pad(Math.round((pace%1)*60))} /km</small>`:''}</div><button onclick="apagaCardio(${S.sessoes.indexOf(s)})" style="opacity:.4;padding:6px">✕</button></div>`; }).join(''):'<div class="empty">Seus cardios aparecem aqui 🏃‍♀️</div>'}
  </div>`;
}
function salvaCardio(){
  const min=parseInt($('#c-min').value)||0, km=parseFloat(($('#c-km').value||'').replace(',','.'))||0;
  if(!min&&!km){ toast('Preencha a duração ou a distância'); return; }
  const nome=modo==='outro'?(($('#c-nome')||{}).value||'').trim():'';
  S.sessoes.push({data:hoje(),mod:modo,nome,min,km:Math.round(km*100)/100,int:cInt}); save(); confete(); rCardio();
}
function apagaCardio(i){ confirma('Apagar este cardio?','Apagar',()=>{ S.sessoes.splice(i,1); save(); rCardio(); }); }

/* timer */
.timer{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));background:var(--plum);color:var(--sky);border-radius:24px;padding:14px 16px;z-index:30;display:none;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(140,31,74,.4)}
.timer.on{display:flex}
.timer .t{font-family:Krona,DM;font-size:30px;min-width:100px}
.timer .bar{flex:1;height:10px;border-radius:9px;background:rgba(210,228,244,.25);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--sky);width:100%}
.timer button{color:var(--sky);font-weight:700;font-size:14px;padding:8px 10px;border-radius:999px;background:rgba(210,228,244,.18)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,0) scale(.8);opacity:0;background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:999px;font-weight:700;z-index:60;transition:transform .25s,opacity .25s;white-space:nowrap;pointer-events:none;font-size:15px}

.conf i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.pago{position:fixed;inset:0;display:none;place-items:center;z-index:65;pointer-events:none}
.pago.on{display:grid;animation:pop 1.6s ease forwards}
.pago div{font-size:54px;color:var(--orange);text-align:center;-webkit-text-stroke:3px var(--cream);paint-order:stroke}

.empty{text-align:center;padding:18px;color:var(--soft);font-size:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{font-family:Krona,DM;font-size:22px;display:block;font-weight:400}

.delta{font-size:12px;font-weight:700;margin-top:2px}

.howto code{background:#fff;padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}

let dbp;
function db(){ if(!dbp) dbp = new Promise((ok,err)=>{ const r = indexedDB.open('sweatclub',1); r.onupgradeneeded = () => r.result.createObjectStore('fotos',{keyPath:'id'}); r.onsuccess=()=>ok(r.result); r.onerror=()=>err(r.error); }); return dbp; }
async function fotoPut(f){ const d = await db(); return new Promise((ok,err)=>{ const tx = d.transaction('fotos','readwrite'); tx.objectStore('fotos').put(f); tx.oncomplete=ok; tx.onerror=()=>err(tx.error); }); }
async function fotoDel(id){ const d = await db(); return new Promise(ok=>{ const tx = d.transaction('fotos','readwrite'); tx.objectStore('fotos').delete(id); tx.oncomplete=ok; }); }
async function fotoAll(){ try { const d = await db(); return await new Promise(ok=>{ const r = d.transaction('fotos').objectStore('fotos').getAll(); r.onsuccess=()=>ok(r.result||[]); r.onerror=()=>ok([]); }); } catch(e){ return []; } }
function comprime(file){ return new Promise((ok,err)=>{ const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => { const M = 1100; let {width:w,height:h} = img; const k = Math.min(1, M/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k); const c = document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); ok(c.toDataURL('image/jpeg',.78)); }; img.onerror=err; img.src = fr.result; }; fr.onerror=err; fr.readAsDataURL(file); }); }

/* ================= WATCH (via Atalhos) =================
   O atalho abre o app com: ?d=AAAA-MM-DD&cal=430&min=52&w=Funcional~45~310|Caminhada~20~90 */
function lerWatch(p){
  const url = !p; p = p || new URLSearchParams(location.search);
  if(!p.has('cal') && !p.has('w') && !p.has('min')) return;
  const d = /^\d{4}-\d{2}-\d{2}$/.test(p.get('d')||'') ? p.get('d') : hoje();
  const num = v => { const n = parseFloat(String(v||'').replace(',','.')); return isFinite(n) ? Math.round(n) : 0; };
  const treinos = (p.get('w')||'').split('|').map(s=>s.trim()).filter(Boolean).map(s=>{ const [tipo,min,cal] = s.split('~'); return {tipo:(tipo||'Treino').trim(), min:num(min), cal:num(cal)}; });
  S.watch[d] = {cal:num(p.get('cal')), min:num(p.get('min')), treinos};
  S.lastWatch = new Date().toISOString();
  save();
  if(url) try{ history.replaceState(null,'',location.pathname); }catch(e){}
  setTimeout(()=>toast('⌚ Dados do Watch atualizados!'),400);
}

  let h='';
  [0.5,1].forEach(f=>{ const yy=y(mx/1.15*f); h+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="rgba(43,22,32,.08)"/>`; });

  svg.innerHTML=h;
  const dn=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'][gSel];
  $('#gtip').innerHTML=`<span><b>${dn}</b></span><span>Esta: <b>${cur[gSel]==null?'—':fmt(cur[gSel])+' '+GUN[gMet]}</b> · Passada: <b>${fmt(ant[gSel])} ${GUN[gMet]}</b></span>`;
}
function calendario(){

  <div class="card c-lav">
    <h3 class="disp">Fotos de progresso</h3>
    ${fotos.length>=2?`<div class="cmp"><figure><img src="${fotos[0].img}" onclick="verFoto('${fotos[0].id}')"><figcaption>Antes • ${fmtBR(fotos[0].data)}</figcaption></figure><figure><img src="${fotos[fotos.length-1].img}" onclick="verFoto('${fotos[fotos.length-1].id}')"><figcaption>Agora • ${fmtBR(fotos[fotos.length-1].data)}</figcaption></figure></div>`:''}
    ${fotos.length?`<div class="gal" style="margin-top:10px">${[...fotos].reverse().map(f=>`<div class="ph" onclick="verFoto('${f.id}')"><img src="${f.img}"><em>${fmtBR(f.data)}</em></div>`).join('')}</div>`:'<div class="muted" style="margin-bottom:10px">Tire uma foto hoje e compare daqui a algumas semanas ✨</div>'}
    <button class="btn full" style="margin-top:12px;background:var(--tomato);color:var(--cream)" onclick="novaFoto('progresso')">📸 Nova foto de progresso</button>
  </div>`;
}
function grafico(reg){
  const pts=reg.filter(r=>r.peso!=null).sort((a,b)=>a.data<b.data?-1:1).slice(-20);
  if(pts.length<2) return '';
  const W=320,H=150,P=24; const vs=pts.map(p=>p.peso); let mn=Math.min(...vs), mx=Math.max(...vs); if(mx-mn<1){mn-=.5;mx+=.5;}
  const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.peso).toFixed(1)).join(' ');
  const dn=vs[vs.length-1]-vs[0], diff=dn.toFixed(1).replace('.',',');
  return `<div class="card c-sun"><div class="row" style="justify-content:space-between"><h3 class="disp" style="margin:0">Peso</h3><b>${dn>0?'+':''}${diff} kg</b></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:8px"><path d="${path}" fill="none" stroke="#008471" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.peso)}" r="5" fill="#FBF6E3" stroke="#008471" stroke-width="3"/>`).join('')}
  <text x="${x(0)}" y="${H-4}" font-size="11" fill="#008471" font-weight="700">${fmtBR(pts[0].data)}</text><text x="${x(pts.length-1)}" y="${H-4}" font-size="11" fill="#008471" font-weight="700" text-anchor="end">${fmtBR(pts[pts.length-1].data)}</text>
  <text x="${x(pts.length-1)}" y="${y(vs[vs.length-1])-12}" font-size="13" fill="#008471" font-weight="700" text-anchor="end">${String(vs[vs.length-1]).replace('.',',')} kg</text></svg></div>`;
}
function salvaMed(){
  const d=$('#m-data').value||hoje(); const r={data:d}; let algum=false;
  MED.forEach(([k])=>{ const v=parseFloat(($('#m-'+k).value||'').replace(',','.')); if(isFinite(v)){ r[k]=v; algum=true; } });
  if(!algum){ toast('Preencha pelo menos uma medida'); return; }
  const ex=S.corpo.find(c=>c.data===d); ex?Object.assign(ex,r):S.corpo.push(r); save(); rCorpo(); toast('Medidas salvas 📏');
}
function apagaMed(d){ confirma('Apagar as medidas de '+fmtBR(d)+'?','Apagar',()=>{ S.corpo=S.corpo.filter(c=>c.data!==d); save(); rCorpo(); }); }
let confOk=null;
function confirma(msg,btn,ok){ confOk=ok; sheet(`<h2 class="disp">Certeza?</h2><p style="margin-top:0">${esc(msg)}</p><button class="btn full" style="background:var(--tomato);margin-bottom:8px" onclick="fechar();confOk&&confOk()">${btn}</button><button class="btn full light" onclick="fechar()">Cancelar</button>`); }

/* ================= AJUSTES ================= */
$('#gear').onclick = () => sheet(`<h2 class="disp">Ajustes</h2>
  <div class="lrow"><span>Seu nome</span><input id="s-nome" value="${esc(S.nome)}"></div>
  <div class="lrow"><span>Meta de treinos/semana</span><input id="s-mt" type="number" inputmode="numeric" value="${S.metaTreinos}"></div>
  <div class="lrow"><span>Meta de água (copos)</span><input id="s-ma" type="number" inputmode="numeric" value="${S.metaAgua}"></div>
  <button class="btn full orange" style="margin:14px 0" onclick="salvaAj()">Salvar</button>
  <div class="card c-sun" style="margin-top:6px" onclick="comoWatch()"><b>⌚ Conectar o Apple Watch</b><div class="muted">Passo a passo do atalho</div></div>
  <div class="card c-pink"><b>💾 Backup</b><div class="muted" style="margin:4px 0 12px">Seus dados ficam só neste iPhone. Faça um backup de vez em quando e salve em Arquivos/iCloud.</div>
    <div class="row"><button class="btn sm" onclick="exportar()">Fazer backup</button><button class="btn sm light" onclick="$('#bkIn').click()">Restaurar</button></div></div>`);
function salvaAj(){ S.nome=$('#s-nome').value.trim()||'Júlia'; S.metaTreinos=Math.max(1,parseInt($('#s-mt').value)||3); S.metaAgua=Math.max(1,parseInt($('#s-ma').value)||8); save(); fechar(); render(); toast('Salvo ✓'); }
async function exportar(){
  const data={app:'sweatclub',v:1,em:new Date().toISOString(),estado:S,fotos:await fotoAll()};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'}); const nome='sweatclub-backup-'+hoje()+'.json';
  const file=new File([blob],nome,{type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:nome}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
$('#bkIn').onchange = async e => { const f=e.target.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); if(d.app!=='sweatclub') throw 0; confirma('Restaurar o backup de '+new Date(d.em).toLocaleDateString('pt-BR')+'? Isso substitui os dados atuais.','Restaurar',async()=>{ S=Object.assign({},DEF,d.estado); save(); for(const ft of (d.fotos||[])) await fotoPut(ft); render(); toast('Backup restaurado ✓'); }); }catch(err){ toast('⚠️ Arquivo de backup inválido'); } };
function comoWatch(){ sheet(`<h2 class="disp">Conectar o Watch</h2><div class="howto">
  <p style="margin-top:0">O app recebe do Apple Watch (via app <b>Atalhos</b>) as <b>calorias ativas</b>, os <b>minutos de exercício</b> e os <b>treinos</b> do dia.</p>
  <p>O atalho abre este endereço com os dados no final:</p>
  <p><code>${esc(location.origin+location.pathname)}?cal=<i>CALORIAS</i>&amp;min=<i>MINUTOS</i>&amp;w=<i>TREINOS</i></code></p>
  <p class="muted">A gente monta o atalho juntas, passo a passo, quando o app estiver no ar no seu iPhone. 😉</p>
  <button class="btn sm" onclick="lerWatch(new URLSearchParams('cal=385&min=48&w=Treino%20funcional~42~290'));fechar();render()">Testar com dados de exemplo</button></div>`); }

/* ================= NAVEGAÇÃO ================= */
let vAtual='inicio';
function go(v){ vAtual=v; document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v)); document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); fechar(); render(); window.scrollTo(0,0); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function render(){ rInicio(); if(vAtual==='treino') rTreino(); if(vAtual==='comida') rComida(); if(vAtual==='corpo') rCorpo(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });

lerWatch(null);
render();
</script>
</body>
